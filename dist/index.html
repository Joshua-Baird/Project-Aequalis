<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Project Aequalis — Interactive</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-JuVVJ7LI.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D4nkCF5l.css">
</head>

<body>
  <main id="app">
    <header class="header">
      <h1>Project Aequalis</h1>
      <p class="sub">
        An interactive visual representation of the terminal
        choose-your-own-adventure.
      </p>
    </header>
    <div id="timer" class="countdown-timer"></div>
    <section id="scene" class="scene ambience-default">
      <div id="scene-bg" class="scene-bg" aria-hidden="true"></div>
      <div id="scene-inner" class="scene-inner">
        <h2 id="scene-title"></h2>
        <div id="scene-text" class="scene-text" aria-live="polite"></div>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <footer class="controls">
      <button id="restart" class="btn btn-secondary">Restart</button>
      <div id="credits">Made from Project Aequalis text files</div>
    </footer>
  </main>

</body>

</html>
